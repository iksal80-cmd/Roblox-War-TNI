<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Operasi Garuda 3D</title>
<meta name="description" content="Game 3D petualangan prajurit TNI menjaga Pulau Rajawali: 5 misi, kondisi alam, alutsista, 5 bahasa. Untuk semua umur, tanpa darah.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#121a10;--olive:#4b5320;--sand:#f5efdc;--gold:#ffd23f;--red:#e70011;--green:#2e7d32;--line:#121a10;--muted:#5f6650}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d140b;font-family:'Fredoka','Cairo',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
html[dir=rtl] body{font-family:'Cairo','Fredoka',system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;touch-action:none;outline:none}
body.nvg #c{filter:grayscale(1) sepia(1) hue-rotate(55deg) saturate(4) brightness(1.25) contrast(1.1)}
body.nvg #nvgVig{display:block}
#nvgVig{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.85) 80%)}
.hidden{display:none!important}
.btn{font:inherit;font-weight:600;font-size:18px;border:3px solid var(--line);border-radius:14px;padding:10px 18px;background:var(--olive);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}.btn.alt{background:#fff;color:var(--ink)}.btn.gold{background:var(--gold);color:var(--ink)}.btn.sm{font-size:15px;padding:6px 12px;box-shadow:0 3px 0 var(--line)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:30;overflow:auto}
.dim{background:radial-gradient(ellipse at center,rgba(10,20,8,.35),rgba(5,10,4,.82))}
.panel{background:var(--sand);border:4px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);padding:18px 20px;width:min(640px,100%);max-height:calc(100vh - 28px);overflow:auto;position:relative}
.panel:before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(var(--red) 50%,#fff 50%);border-radius:18px 18px 0 0}
h1{margin:6px 0 0;font-size:40px;line-height:1;letter-spacing:.5px;text-align:center}h1 .a{color:var(--red)}h1 .b{color:var(--olive)}
h2{margin:0 0 8px;font-size:24px}h4{margin:12px 0 6px;font-size:16px}
.tag{display:block;width:max-content;margin:6px auto 0;background:var(--olive);color:var(--gold);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.sub{color:var(--muted);margin:8px 0 6px;line-height:1.45;font-size:15px}
label.lbl{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:9px 12px;border:3px solid var(--line);border-radius:12px;background:#fff;user-select:text}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:80px;font:inherit;font-weight:600;font-size:15px;padding:8px 6px;border:3px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.seg button.on{background:var(--olive);color:var(--gold)}
#langSeg button{min-width:58px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:130px}
.how{font-size:13px;color:var(--muted);line-height:1.55;margin-top:12px;background:#fff;border-radius:12px;padding:8px 12px;border:2px dashed #cfc6a8}.how b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.credit{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.45;border-top:2px solid #e2d8b8;padding-top:10px}
.credit img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block;margin:0 auto 4px}
.island{position:relative;width:100%;aspect-ratio:10/7;background:linear-gradient(#2c6fa0,#1d4f78);border:3px solid var(--line);border-radius:16px;overflow:hidden;margin-top:6px}
.island svg{position:absolute;inset:0;width:100%;height:100%}
.mnode{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--gold);font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center}
.mnode small{position:absolute;bottom:-8px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mnode.lock{background:#bbb;filter:grayscale(1)}.mnode.cur{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
.mlist{display:grid;gap:8px;margin-top:10px}.mitem{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;font:inherit;text-align:start}
.mitem.lock{opacity:.5}.mitem .ic{font-size:28px}.mitem .tx{flex:1}.mitem b{font-size:16px}.mitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stars{color:#f7b500;font-size:18px;letter-spacing:1px;white-space:nowrap}.stars i{color:#cfc6a8;font-style:normal}
.bhead{display:flex;gap:12px;align-items:center}.bhead span{font-size:44px}.bhead b{font-size:22px;display:block}.bhead small{color:var(--muted)}
.bgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.bgrid ol{margin:0;padding-inline-start:20px;line-height:1.5;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#fff;border:2px solid #cfc6a8;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.vals{margin:0;padding-inline-start:18px;line-height:1.6}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#fff;border:3px solid var(--olive);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.4}.card b{display:block;color:var(--red)}.card.lock{border-color:#cfc6a8;color:#999}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#obj{position:absolute;top:10px;inset-inline-start:10px;background:rgba(14,22,10,.86);color:#fff;border:3px solid var(--gold);border-radius:14px;padding:8px 12px;max-width:min(380px,58vw);font-size:14px;line-height:1.35}
#obj .mt{color:var(--gold);font-weight:700;font-size:15px}#obj .ot{font-weight:600;font-size:16px;margin:2px 0}#obj .oi{font-size:12px;opacity:.85}
#mini{position:absolute;top:10px;inset-inline-end:10px;width:140px;height:140px;border-radius:50%;border:3px solid var(--gold);background:rgba(10,20,15,.4)}
#topBtns{position:absolute;top:156px;inset-inline-end:10px;display:flex;gap:6px;pointer-events:auto}
#hpWrap{position:absolute;left:12px;bottom:14px;width:min(240px,40vw);background:rgba(14,22,10,.86);border:3px solid #fff;border-radius:12px;padding:5px 8px;color:#fff;font-weight:700;font-size:13px;direction:ltr}
#hpWrap .bar{height:12px;background:#333;border-radius:99px;overflow:hidden;margin-top:3px}#hpBar{height:100%;width:100%;background:#7cff6b;transition:width .2s}
#ammo{position:absolute;right:14px;bottom:14px;background:rgba(14,22,10,.86);color:#fff;border:3px solid #fff;border-radius:12px;padding:4px 12px;font-size:16px;direction:ltr}#ammo b{font-size:30px}#ammo small{opacity:.7}#ammo span{margin-left:8px;color:var(--gold)}
#sup{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;pointer-events:auto;direction:ltr}
#spPts{background:var(--gold);border:3px solid var(--line);border-radius:12px;padding:4px 8px;font-weight:700}
.sbtn{position:relative;overflow:hidden;width:72px;height:66px;border:3px solid var(--line);border-radius:12px;background:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--line)}
.sbtn span{font-size:24px;line-height:1}.sbtn em{font-style:normal;font-size:10px;font-weight:700;white-space:nowrap}.sbtn small{font-size:10px;color:#a37a00;font-weight:700}
.sbtn i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);height:0}.sbtn.off{opacity:.55}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}#cross:before{left:12px;top:0;width:2px;height:26px}#cross:after{top:12px;left:0;height:2px;width:26px}
#cross.aim{width:16px;height:16px}#cross.aim:before{left:7px;height:16px}#cross.aim:after{top:7px;width:16px}#cross.hit:before,#cross.hit:after{background:#ff4040}
#hitdir{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}#hitdir:before{content:'▲';position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:#ff3030;font-size:28px;text-shadow:0 0 6px #f00}
#mark{position:absolute;transform:translate(-50%,-50%);text-align:center;color:var(--gold);font-weight:700;text-shadow:0 2px 3px #000;display:none}#mark b{display:block;font-size:26px}#mark span{font-size:13px;color:#fff}
#radio{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(10,16,8,.9);color:#fff;border-left:5px solid var(--gold);border-radius:10px;padding:6px 14px;max-width:min(640px,92vw);font-size:16px;opacity:0;transition:opacity .3s}
#radio.show{opacity:1}#radio b{display:block;color:var(--gold);font-size:13px}
#act{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(10,16,8,.9);color:#fff;border:3px solid var(--gold);border-radius:12px;padding:6px 14px;font-weight:700;text-align:center;min-width:160px}
#act .pb{height:8px;background:#333;border-radius:99px;overflow:hidden;margin-top:4px}#actBar{height:100%;width:0;background:var(--gold)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.65))}
#flash{position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;background:#fff}
#downOv{position:fixed;inset:0;z-index:13;display:flex;align-items:center;justify-content:center;background:rgba(40,0,0,.45);color:#fff;font-size:24px;font-weight:700;text-align:center;padding:20px;pointer-events:none;backdrop-filter:grayscale(.8)}
#lockMsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:14;background:rgba(10,16,8,.92);color:#fff;border:3px solid var(--gold);border-radius:16px;padding:14px 22px;font-size:20px;font-weight:700;cursor:pointer;text-align:center}
#photoHint,#vehHint{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(10,16,8,.8);color:#fff;border-radius:10px;padding:4px 12px;font-weight:600;font-size:15px}
#vehHint{top:auto;bottom:150px}
#banner{position:fixed;top:22%;left:50%;transform:translate(-50%,-10px);color:#fff;font-size:44px;font-weight:800;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:15;text-align:center;-webkit-text-stroke:2px var(--line);text-shadow:0 5px 0 var(--line);max-width:94vw}
#banner.show{opacity:1;transform:translate(-50%,0)}#banner small{display:block;font-size:18px;-webkit-text-stroke:0;text-shadow:0 2px 3px #000;color:var(--gold);margin-top:4px}
#toast{position:fixed;bottom:190px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;max-width:90vw;text-align:center;font-size:16px;border:2px solid var(--gold)}#toast.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:28;transition:opacity .45s}#fade.on{opacity:1}
/* sentuh */
#joy{position:fixed;left:0;bottom:0;width:42vw;height:62vh;z-index:9;display:none;touch-action:none}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.7);display:none}
#joyKnob{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--line);left:33px;top:33px}
#tb{position:fixed;inset:0;pointer-events:none;z-index:11}
#tb button{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--line);font:inherit;font-weight:700;font-size:22px;box-shadow:0 4px 0 var(--line);touch-action:none;background:#fff}
#tb button.dn{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#tFire{width:84px;height:84px;right:16px;bottom:18px;background:var(--red)!important;color:#fff}#tAim{width:56px;height:56px;right:112px;bottom:78px}#tJump{width:54px;height:54px;right:108px;bottom:12px}
#tNade{width:50px;height:50px;right:26px;bottom:112px}#tReload{width:46px;height:46px;right:176px;bottom:12px}#tUse{width:60px;height:60px;right:178px;bottom:66px;background:var(--gold)!important}#tCrouch{width:46px;height:46px;right:84px;bottom:146px}
#tPhoto{width:64px;height:64px;left:50%;top:40%;transform:translateX(-50%);background:var(--gold)!important}
body.touch #joy{display:block}body.touch #ammo{bottom:52px;left:50%;right:auto;transform:translateX(-50%);font-size:13px;padding:2px 10px}body.touch #ammo b{font-size:20px}
body.touch #sup{left:auto;right:auto;inset-inline-start:10px;transform:none;bottom:auto;top:110px;flex-direction:column;align-items:flex-start}body.touch .sbtn{width:56px;height:48px}body.touch .sbtn em{display:none}
body.touch #hpWrap{bottom:auto;top:auto;left:50%;transform:translateX(-50%);bottom:8px;width:200px}body.touch #mini{width:100px;height:100px}body.touch #topBtns{top:116px}body.touch #radio{bottom:60px;font-size:14px}body.touch #obj{font-size:12px;max-width:52vw}body.touch #obj .ot{font-size:13px}
/* modal */
#modal{z-index:50}#modal .panel{width:min(620px,100%)}
.bigres{font-size:30px;font-weight:800;text-align:center;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}.stats div{background:#fff;border:2px solid #cfc6a8;border-radius:12px;padding:6px 8px;font-size:13px;text-align:center}.stats b{display:block;font-size:22px}
.val{background:#e8f5e9;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.45;font-weight:600}
.cert{width:100%;border-radius:10px;border:3px solid var(--line);margin-top:10px}
.sw{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-weight:600}
.pznote{background:#fff8d6;border:2px dashed #c9a400;border-radius:10px;padding:8px;font-size:15px}.pzq{font-size:30px;font-weight:800;text-align:center;margin:10px 0;direction:ltr}
.pzscr{font-family:monospace;font-size:38px;background:#021;color:#3f6;border-radius:10px;text-align:center;padding:6px;letter-spacing:6px;direction:ltr}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;direction:ltr}.keypad .btn{font-size:24px;padding:10px}
.bombtm{text-align:center;font-size:28px;font-weight:800;color:var(--red)}.wires{display:flex;gap:14px;justify-content:center;margin-top:12px;direction:ltr}
.wire{width:80px;height:150px;border:3px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;position:relative;font:inherit}
.wire:before{content:'';position:absolute;left:50%;top:6px;bottom:40px;width:12px;transform:translateX(-50%);background:var(--c);border-radius:6px}
.wire span{position:absolute;bottom:6px;left:0;right:0;font-size:26px;font-weight:800}.wire.cut:before{background:linear-gradient(var(--c) 45%,transparent 45%,transparent 55%,var(--c) 55%)}.wire.bad{opacity:.4}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d140b;color:#fff;font-size:22px;font-weight:600;z-index:80}
#loading .em{font-size:64px;animation:fl 1s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-14px)}}
@media (max-width:560px){h1{font-size:30px}.bgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}#banner{font-size:30px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="nvgVig"></div>
<div id="loading"><div class="em">🪖</div><span data-i="loading">Menyiapkan pulau…</span></div>
<div id="fade"></div><div id="hurt"></div><div id="flash"></div>
<div id="hud" class="hidden">
  <div id="obj"></div><canvas id="mini" width="140" height="140"></canvas>
  <div id="topBtns"><button class="btn alt sm hidden" id="nvgBtn" title="N">🥽</button><button class="btn alt sm" id="pauseBtn" title="P">⏸</button></div>
  <div id="cross"></div><div id="hitdir"></div><div id="mark"></div>
  <div id="hpWrap">❤️ <span data-i="hp"></span><div class="bar"><div id="hpBar"></div></div></div>
  <div id="ammo"></div><div id="sup"></div><div id="radio"></div>
  <div id="act" class="hidden"><span id="actTxt"></span><div class="pb"><div id="actBar"></div></div></div>
  <div id="photoHint" class="hidden">📸 F</div><div id="vehHint" class="hidden">🛡️ WASD · 🖱️ · E</div>
</div>
<div id="downOv" class="hidden"><span id="downTxt"></span></div>
<div id="lockMsg" class="hidden">🖱️ <span data-i="clickLock"></span></div>
<div id="banner"></div><div id="toast"></div>
<div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
<div id="tb" class="hidden"><button id="tFire">🔫</button><button id="tAim">🎯</button><button id="tJump">⤒</button><button id="tNade">💣</button><button id="tReload">🔄</button><button id="tUse">✋</button><button id="tCrouch">🧎</button><button id="tPhoto" class="hidden">📸</button></div>

<div id="menu" class="screen dim hidden"><div class="panel">
  <div class="seg" id="langSeg" style="margin-top:6px"></div>
  <h1><span class="a">OPERASI</span> <span class="b">GARUDA</span> 3D</h1>
  <span class="tag" data-i="tag"></span>
  <div class="sub" data-i="sub" style="text-align:center"></div>
  <label class="lbl" for="pName" data-i="name"></label><input type="text" id="pName" maxlength="20">
  <label class="lbl" data-i="avatar"></label><div class="seg" id="gSeg"><button data-g="m" data-i="male"></button><button data-g="f" data-i="female"></button></div>
  <label class="lbl" data-i="branch"></label><div class="seg" id="bSeg"><button data-b="AD" data-i="AD"></button><button data-b="AL" data-i="AL"></button><button data-b="AU" data-i="AU"></button></div>
  <label class="lbl" data-i="diff"></label><div class="seg" id="dSeg"><button data-d="0" data-i="d0"></button><button data-d="1" data-i="d1"></button><button data-d="2" data-i="d2"></button></div>
  <div class="row"><button class="btn gold" id="goMap" data-i="play"></button></div>
  <div class="row"><button class="btn alt" id="goLib" data-i="library"></button></div>

 m1d:['Pasukan Bayangan menyandera warga desa di tengah hutan. Terjun payung dari pesawat Hercules, intai kamp dengan drone, lalu bebaskan warga.','Pasukan Bayangan nyandera warga desa ing tengah alas. Terjun payung saka pesawat Hercules, intip kemah nganggo drone, banjur bebasake warga.','Pasukan Bayangan nyandera warga désa di tengah leuweung. Terjun payung tina kapal udara Hercules, intip kémah ku drone, tuluy bébaskeun warga.','The Shadow Force is holding villagers hostage in the jungle. Parachute from a Hercules plane, scout the camp with a drone and free the villagers.','قوات الظل تحتجز قرويين في الغابة. اقفز بالمظلة من طائرة هيركوليس واستطلع المعسكر بالطائرة المسيرة وحرر القرويين.'],
 m2d:['Markas musuh ada di balik punggung bukit, dekat gunung berapi yang berasap. Foto markas, lumpuhkan penjaga di menara, matikan alarm, lalu ambil data rahasia.','Markas mungsuh ana ing mburi punggung bukit, cedhak gunung geni sing kebul-kebul. Foto markas, lumpuhna penjaga ing menara, pateni alarm, banjur jupuk data rahasia.','Markas musuh aya di tukangeun tonggong pasir, deukeut gunung seuneu nu ngebul. Poto markas, lumpuhkeun penjaga di munara, pareuman alarm, tuluy candak data rusiah.','The enemy base is just over the ridge near a smoking volcano. Photograph it, take down the tower guards, disable the alarm and grab the secret data.','قاعدة العدو خلف التلة قرب بركان يتصاعد دخانه. صوّرها، وأوقف حراس الأبراج، وعطّل الإنذار، واحصل على البيانات السرية.'],
 m3d:['Senjata selundupan disimpan di gudang pelabuhan. Kapal perang KRI melindungimu dari laut. Amankan dermaga, ledakkan gudang senjata, dan hadang panser musuh.','Gegaman selundupan disimpen ing gudang pelabuhan. Kapal perang KRI nglindhungi kowe saka segara. Amanna dermaga, bledhosna gudang gegaman, lan adhang panser mungsuh.','Pakarang selundupan disimpen di gudang palabuhan. Kapal perang KRI ngajaga anjeun ti laut. Amankeun dermaga, bitukeun gudang pakarang, jeung hadang panser musuh.','Smuggled weapons are stored in the harbour warehouses. A KRI warship covers you from the sea. Secure the dock, blow up the weapon caches and stop the enemy APC.','أسلحة مهربة مخزنة في مستودعات الميناء. سفينة حربية إندونيسية تحميك من البحر. أمّن الرصيف وفجّر مخازن الأسلحة وأوقف مدرعة العدو.'],
 m4d:['Malam berhujan petir. Susupi markas komando yang ternyata sedang latihan tembak. Naik ke menara kontrol, retas komputer pusat (pecahkan kode matematika!), lalu kabur dari kejaran panser.','Wengi udan bledhek. Susupi markas komando sing jebul lagi latihan nembak. Munggah menara kontrol, retas komputer pusat (pecahna kode matematika!), banjur mlayu saka oyakan panser.','Peuting hujan gelap. Susupan markas komando nu kasampak keur latihan nembak. Naék ka munara kontrol, retas komputer puseur (pecahkeun kode matematika!), tuluy kabur tina udagan panser.','A stormy night. Sneak into the command base, which turns out to be running a live-fire drill. Climb the control tower, hack the main computer (crack the maths code!) and escape the APC.','ليلة عاصفة. تسلل إلى قاعدة القيادة التي تجري تدريبًا بالذخيرة الحية. اصعد برج المراقبة واخترق الحاسوب المركزي (حل رمز الرياضيات!) ثم اهرب من المدرعة.'],
 m5d:['Pemimpin Pasukan Bayangan memasang bom di kota. Kendarai Tank Harimau buatan Pindad, hancurkan barikade, bebaskan sandera, kalahkan Komandan Bayangan, jinakkan bom, dan kibarkan Sang Merah Putih!','Pemimpin Pasukan Bayangan masang bom ing kutha. Tumpakana Tank Harimau gawean Pindad, ajurna barikade, bebasna sandera, kalahna Komandan Bayangan, jinakna bom, lan kibarna Sang Merah Putih!','Pamingpin Pasukan Bayangan masang bom di kota. Tumpakan Tank Harimau buatan Pindad, ancurkeun barikade, bébaskeun sandera, éléhkeun Komandan Bayangan, jinakkeun bom, tur kibarkeun Sang Merah Putih!','The Shadow Force leader has planted a bomb in the city. Drive the Pindad-made Harimau tank, smash the barricades, free the hostages, defeat the Shadow Commander, defuse the bomb and raise the Red and White flag!','زرع قائد قوات الظل قنبلة في المدينة. قد دبابة هاريماو المصنوعة في بينداد، وحطم الحواجز، وحرر الرهائن، واهزم قائد الظل، وفكك القنبلة، وارفع العلم الأحمر والأبيض!'],

 d1a:['Prajurit, selamat datang di Pulau Rajawali. Warga desa disandera Pasukan Bayangan. Mendarat dengan aman!','Prajurit, sugeng rawuh ing Pulo Rajawali. Warga desa disandera Pasukan Bayangan. Mendarat kanthi slamet!','Prajurit, wilujeng sumping di Pulo Rajawali. Warga désa disandera Pasukan Bayangan. Darat kalayan aman!','Soldier, welcome to Rajawali Island. Villagers are held by the Shadow Force. Land safely!','أيها الجندي، مرحبًا بك في جزيرة راجاوالي. القرويون محتجزون لدى قوات الظل. اهبط بسلام!'],
 d1b:['Aku di sini! Kamp mereka ada di balik pepohonan. Terbangkan drone dan foto dulu.','Aku ing kene! Kemahe ana ing mburi wit-witan. Mabura drone lan foto dhisik.','Kuring di dieu! Kémahna aya di tukangeun tatangkalan. Apungkeun drone jeung poto heula.','Over here! Their camp is past those trees. Fly the drone and take a picture first.','أنا هنا! معسكرهم خلف تلك الأشجار. أطلق الطائرة المسيرة والتقط صورة أولًا.'],
 d1c:['Bagus! Aku melihat penjaga. Pilih sasaranmu, aku melindungimu.','Apik! Aku weruh penjaga. Pilih sasaranmu, aku nglindhungi kowe.','Saé! Kuring ningali penjaga. Pilih sasaran anjeun, kuring ngajaga anjeun.','Nice! I see guards. Choose your target, I\'ve got your back.','أحسنت! أرى حراسًا. اختر هدفك وأنا أغطيك.'],
 d1d:['Kamp aman. Cepat bebaskan warga di pondok!','Kemah aman. Enggal bebasna warga ing gubug!','Kémah aman. Gancang bébaskeun warga di saung!','Camp is clear. Quickly free the villagers in the huts!','المعسكر آمن. حرر القرويين في الأكواخ بسرعة!'],
 d1e:['Semua warga selamat! Helikopter menunggu di titik jemput.','Kabeh warga slamet! Helikopter ngenteni ing titik jemput.','Sadaya warga salamet! Hélikopter ngantosan di titik jemput.','All villagers are safe! The helicopter is waiting at the pickup.','جميع القرويين بأمان! المروحية بانتظارك عند نقطة الإخلاء.'],
 d2a:['Markas ada di balik punggung bukit berikutnya. Masuk, cari informasi, lalu keluar.','Markas ana ing mburi punggung bukit sabanjure. Mlebu, golek informasi, banjur metu.','Markas aya di tukangeun tonggong pasir salajengna. Asup, téangan informasi, tuluy kaluar.','The base is just over the next ridge. Get in, learn what you can, and get out.','القاعدة خلف التلة التالية. ادخل واعرف ما تستطيع ثم اخرج.'],
 d2b:['Ada penjaga di atas dan di bawah. Aku akan mematikan alarm setelah menara aman.','Ana penjaga ing dhuwur lan ngisor. Aku bakal mateni alarm sawise menara aman.','Aya penjaga di luhur jeung di handap. Kuring bakal mareuman alarm sanggeus munara aman.','Guards high and low. I\'ll go for the alarm once the towers are clear.','حراس في الأعلى والأسفل. سأتوجه إلى الإنذار بعد تأمين الأبراج.'],
 d2c:['Alarm mati. Cari jalan masuk ke gedung utama!','Alarm mati. Golek dalan mlebu menyang gedhung utama!','Alarm pareum. Téangan jalan asup ka gedong utama!','Alarm is down. Find a way into the main building!','الإنذار معطل. ابحث عن طريق إلى المبنى الرئيسي!'],
 d2d:['Datanya sudah di tangan. Waktunya pergi!','Datane wis ing tangan. Wektune lunga!','Datana tos aya. Waktosna angkat!','We have the data. Time to go!','حصلنا على البيانات. حان وقت الرحيل!'],
 d3a:['KRI di sini, kami melindungi pendaratanmu dengan meriam!','KRI ing kene, kita nglindhungi pendaratanmu nganggo meriam!','KRI di dieu, urang ngajaga pandaratan anjeun ku mariem!','KRI here, covering your landing with our guns!','هنا السفينة الحربية، نغطي إنزالك بمدافعنا!'],
 d3b:['Dermaga aman. Gudang senjata ada di dua bangunan biru.','Dermaga aman. Gudang gegaman ana ing rong bangunan biru.','Dermaga aman. Gudang pakarang aya di dua wangunan bulao.','Dock secure. The weapon caches are in the two blue sheds.','الرصيف آمن. مخازن الأسلحة في السقيفتين الزرقاوين.'],
 d3c:['Kendaraan datang! Itu panser musuh! Pakai granat atau panggil helikopter!','Kendharaan teka! Kuwi panser mungsuh! Nganggo granat utawa undang helikopter!','Kandaraan datang! Éta panser musuh! Paké granat atanapi panggil hélikopter!','Vehicle inbound! That\'s an enemy APC! Use grenades or call the helicopter!','مركبة قادمة! إنها مدرعة العدو! استخدم القنابل أو استدعِ المروحية!'],
 d3d:['Panser hancur! Kapal cepat menunggu di ujung dermaga.','Panser ajur! Kapal cepet ngenteni ing pucuk dermaga.','Panser ancur! Kapal gancang ngantosan di tungtung dermaga.','APC down! The speedboat is waiting at the end of the dock.','دُمّرت المدرعة! الزورق ينتظرك في نهاية الرصيف.'],
 d4a:['Hujan petir menutupi langkah kita. Pakai kacamata malam (N) kalau terlalu gelap.','Udan bledhek nutupi lakune awake dhewe. Nganggo kacamata wengi (N) yen peteng banget.','Hujan gelap nutupan léngkah urang. Paké kacamata peuting (N) upami poék teuing.','The storm covers our approach. Use night vision (N) if it\'s too dark.','العاصفة تغطي تقدمنا. استخدم الرؤية الليلية (N) إن كان الظلام شديدًا.'],
 d4b:['Ini kota latihan! Mereka sedang latihan tembak langsung. Hati-hati!','Iki kutha latihan! Dheweke lagi latihan nembak langsung. Ati-ati!','Ieu kota latihan! Maranéhna keur latihan nembak langsung. Ati-ati!','It\'s a training town! They\'re running a live-fire drill. Careful!','إنها مدينة تدريب! يجرون تدريبًا بالذخيرة الحية. احذر!'],

 d4d:['Ini pusat komando mereka. Retas komputernya! Ada catatan sandi di meja.','Iki pusat komandone. Retasen komputere! Ana cathetan sandi ing meja.','Ieu puseur komandona. Retas komputerna! Aya catetan sandi di méja.','This is their command centre. Hack the computer! There\'s a password note on the desk.','هذا مركز قيادتهم. اخترق الحاسوب! هناك ملاحظة بكلمة السر على المكتب.'],
 d4e:['Data rencana bom didapat! Panser itu akan mengejar kita. Lari ke pintu keluar!','Data rencana bom wis dijupuk! Panser kuwi bakal ngoyak awake dhewe. Mlayu menyang lawang metu!','Data rencana bom kapanggih! Panser éta bakal ngudag urang. Lumpat ka panto kaluar!','Bomb plan data secured! That APC is coming for us. Run for the exit!','حصلنا على خطة القنبلة! المدرعة ستلاحقنا. اركض إلى المخرج!'],

 d5b:['Jalan terbuka! Turun dan bebaskan sandera di gedung kuning.','Dalan kebukak! Mudhuna lan bebasna sandera ing gedhung kuning.','Jalan kabuka! Turun jeung bébaskeun sandera di gedong konéng.','The road is open! Get out and free the hostages in the yellow building.','الطريق مفتوح! انزل وحرر الرهائن في المبنى الأصفر.'],

  g.fillStyle='#b8000e';g.font=`800 92px ${FONT}`;g.fillText(save.name||'Prajurit Garuda',800,580,1300);g.strokeStyle='#d4a017';g.lineWidth=4;g.beginPath();g.moveTo(420,610);g.lineTo(1180,610);g.stroke();
  g.fillStyle='#1d2b14';g.font=`600 34px ${FONT}`;g.fillText(t('certC'),800,680,1380);g.font=`500 28px ${FONT}`;g.fillStyle='#333';MISSIONS.forEach((m,i)=>g.fillText(m.ic+' '+t(m.key)+'  '+'★'.repeat(save.stars[i]||0),800,750+i*40));
  g.font=`700 32px ${FONT}`;g.fillStyle='#1d2b14';g.fillText(t('school')+' (KRN)',800,985);g.font=`500 22px ${FONT}`;g.fillStyle='#5d6488';g.fillText(ADDR+' · '+new Date().toLocaleDateString(save.lang==='ar'?'ar':save.lang==='en'?'en-GB':'id-ID',{day:'numeric',month:'long',year:'numeric'}),800,1030,1400);return c}
/* ---------- layar & menu ---------- */
function hideScreens(){['menu','sub','modal'].forEach(i=>show(i,false))}
function modal(title,html){$('mT').textContent=title;$('mB').innerHTML=html;show('modal',true)}
function openPause(){if(!G||G.state!=='play')return;G.state='pause';unlockMouse();hush();const tg=(k,on)=>`<div class="sw"><span>${esc(t(k))}</span><button class="btn sm ${on?'gold':'alt'}" data-tg="${k}">${esc(on?t('on'):t('off'))}</button></div>`;
  modal('⏸ '+t('pause'),`<label class="lbl">${esc(t('lang'))}</label><div class="seg" id="pLang">${LANGS.map((l,i)=>`<button data-l="${l}" class="${save.lang===l?'on':''}">${LANG_NAME[i]}</button>`).join('')}</div>${tg('music',save.music)}${tg('voice',save.voice)}
    <div class="sw"><span>${esc(t('sens'))}</span><input type="range" id="pSens" min="0.4" max="2" step="0.1" value="${save.sens}"></div><div class="how">${t(TOUCH?'ctrlTouch':'ctrlKeys')}</div>
    <div class="row"><button class="btn gold" id="pRes">${esc(t('resume'))}</button><button class="btn alt" id="pQuit">🗺️ ${esc(t('quit'))}</button></div>`);
  $('pLang').onclick=e=>{const b=e.target.closest('button');if(!b)return;setLang(b.dataset.l);G.state='play';openPause()};$('mB').querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{save[b.dataset.tg]=!save[b.dataset.tg];persist();setVol();G.state='play';openPause()});
  $('pSens').oninput=e=>{save.sens=+e.target.value;persist()};$('pRes').onclick=resume;$('pQuit').onclick=goMap}
function resume(){show('modal',false);if(G&&G.state==='pause'){G.state='play';if(!TOUCH){if(dragMode)show('lockMsg',false);else lockMouse()}}}
$('pauseBtn').onclick=e=>{e.stopPropagation();openPause()};$('nvgBtn').onclick=e=>{e.stopPropagation();toggleNVG()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state==='play')openPause()});
function setLang(l){save.lang=l;persist();applyLang();if(!$('menu').classList.contains('hidden'))renderMenu();sfx('click')}
function goMap(){clearMission();G=null;show('modal',false);show('hud',false);show('tb',false);show('lockMsg',false);buildMenuScene();music('menu');openMap()}
function openMenu(){hideScreens();show('menu',true);renderMenu()}
function renderMenu(){$('langSeg').innerHTML=LANGS.map((l,i)=>`<button data-l="${l}" class="${save.lang===l?'on':''}">${LANG_NAME[i]}</button>`).join('');
  $('gSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===save.g));$('bSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.b===save.br));$('dSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.d===save.diff));
  $('pName').value=save.name;$('pName').placeholder=t('namePh');$('addr').textContent=ADDR}
$('langSeg').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('gSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;save.g=b.dataset.g;persist();renderMenu();menuAvatar()};
$('bSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;save.br=b.dataset.b;persist();renderMenu();menuAvatar()};
$('dSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;save.diff=+b.dataset.d;persist();renderMenu()};
$('pName').oninput=e=>{save.name=e.target.value.trim().slice(0,20);persist()};
$('goMap').onclick=()=>{ac();sfx('click');music('menu');openMap()};$('goLib').onclick=()=>{sfx('click');openLib()};$('subBack').onclick=()=>{sfx('click');subBack()};
let subBack=openMenu;
function openSub(title,html,back){hideScreens();$('subT').textContent=title;$('subB').innerHTML=html;show('sub',true);subBack=back||openMenu}
function openMap(){let h=`<div class="island"><svg viewBox="0 0 100 70" preserveAspectRatio="none"><path d="M8,40 C5,20 25,6 45,10 C60,4 80,8 92,24 C98,40 90,58 72,62 C55,68 30,66 18,58 C10,52 9,46 8,40Z" fill="#3f8a3a" stroke="#e8d79a" stroke-width="1.6"/><path d="M42,14 L50,24 L58,14" fill="none" stroke="#6b5a42" stroke-width="1.2"/></svg>`;
  MISSIONS.forEach((m,i)=>{const lock=i>save.prog;h+=`<button class="mnode ${lock?'lock':''} ${i===save.prog?'cur':''}" style="left:${m.pos[0]*100}%;top:${m.pos[1]*100}%" data-m="${i}">${lock?'🔒':m.ic}<small>${i+1}</small></button>`});h+='</div><div class="mlist">';
  MISSIONS.forEach((m,i)=>{const lock=i>save.prog;h+=`<button class="mitem ${lock?'lock':''}" data-m="${i}"><span class="ic">${m.ic}</span><span class="tx"><b>${i+1}. ${esc(t(m.key))}</b><small>${m.nat.map(k=>esc(t(k))).join(' · ')}</small></span>${lock?'🔒':stars(save.stars[i]||0)}</button>`});h+='</div>';
  openSub('🗺️ '+t('map'),h,openMenu);$('subB').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(i>save.prog){sfx('bad');toast(t('locked'));return}sfx('click');openBrief(i)})}
const BRIEF_OBJ=[['oMeet','oPhoto','oClear','oRescue','oGoLZ'],['oRidge','oPhoto','oSnipers','oAlarm','oEnter','oData','oGoLZ'],['oClear','oCharge','oApc','oBoat'],['oFence','oTown','oTower','oHack','oEscape','oGoLZ'],['oTank','oBarr','oOut','oBoss','oBomb','oFlag']];
const BRIEF_ARG=[['','pCamp','pCamp'],['','pBase'],['pDock'],[],[]];
function openBrief(i){const m=MISSIONS[i];const h=`<div class="bhead"><span>${m.ic}</span><div><b>${esc(t(m.key))}</b><small>${i+1}/5</small></div></div><p class="sub">${esc(t(m.desc))}</p>
  <div class="bgrid"><div><h4>🎯 ${esc(t('objs'))}</h4><ol>${BRIEF_OBJ[i].map((k,j)=>`<li>${esc(t(k,BRIEF_ARG[i][j]?t(BRIEF_ARG[i][j]):''))}</li>`).join('')}</ol></div><div><h4>🌏 ${esc(t('nature'))}</h4><div class="chips">${m.nat.map(k=>`<span>${esc(t(k))}</span>`).join('')}</div><h4>🛡️ ${esc(t('support'))}</h4><div class="chips">${m.eq.concat(['e_heli','e_drone','e_jet']).filter((v,k,a)=>a.indexOf(v)===k).map(k=>`<span>${esc(t(k))}</span>`).join('')}</div></div></div>
  <div class="note">${esc(t('starsInfo'))}</div><div class="note">${esc(t('safe'))}</div><div class="row"><button class="btn gold" id="bGo">${esc(t('start'))}</button></div>`;
  openSub('📋 '+t('brief'),h,openMap);$('bGo').onclick=()=>{ac();sfx('click');startMission(i)};say(t(m.key)+'. '+t(m.desc),true)}
function openLib(){const F=['f1','f2','f3','f4','f5','f6','f7','f8','f9','f10'];const h=`<h4>🎖️ ${esc(t('valT'))}</h4><ul class="vals">${[1,2,3,4,5].map(i=>`<li>${esc(t('v'+i))}</li>`).join('')}</ul><h4>📁 ${esc(t('cards'))} (${save.intel.length}/10)</h4><div class="cards">${F.map((k,i)=>save.intel.includes(k)?`<div class="card"><b>#${i+1}</b>${esc(t(k))}</div>`:`<div class="card lock"><b>#${i+1}</b>🔒 ${esc(t('notYet'))}</div>`).join('')}</div>`;openSub(t('library'),h,openMenu)}
function showIntel(k){toast('📁 '+t('intelGot'),2000);setTimeout(()=>toast('📁 '+t(k),5200),1600)}
langHooks.push(()=>{if(!$('sub').classList.contains('hidden')){const tt=$('subT').textContent;if(subBack===openMenu&&tt.includes('🗺️'))openMap()}});
/* ---------- diorama menu ---------- */
let menuAv=null,menuG=null;
function buildMenuScene(){clearMission();newWorld();applyEnv(ENVS.city);Object.assign(WX,{rain:0,ash:0,ff:0,lightning:0});SEED=9;const H=(x,z)=>fbm(x/30,z/30)*2-1+smooth(30,60,hyp(x,z))*12;W.H=H;
  buildTerrain(H,(c,x,z,y)=>c.setHSL(.25,.45,.25+fbm(x/6,z/6)*.1));const tk=mkTank();tk.position.set(-7,H(-7,-3),-3);tk.rotation.y=.5;W.g.add(tk);const ap=mkAPC(false);ap.position.set(8,H(8,-5),-5);ap.rotation.y=-.6;W.g.add(ap);
  const fp=flagpole(W.g,0,-8,9);fp.userData.flag.position.y=8.2;const h=mkHeli();W.g.add(h);W.anims.push((dt,tm)=>{h.position.set(Math.cos(tm*.25)*26,14+Math.sin(tm*.5),Math.sin(tm*.25)*26-6);h.rotation.y=-tm*.25;h.userData.rotor.rotation.y+=dt*25;h.userData.trotor.rotation.x+=dt*30;
    const a=fp.userData.flag.geometry.attributes.position;for(let i=0;i<a.count;i++)a.setZ(i,Math.sin(a.getX(i)*3+tm*5)*.12*(a.getX(i)+.9));a.needsUpdate=true});
  scatter('jungle',scatterArea(40,-60,60,-60,60,(x,z)=>hyp(x,z)<22),.5);scatter('bush',scatterArea(40,-50,50,-50,50,(x,z)=>hyp(x,z)<12));let jt=6;W.anims.push(dt=>{jt-=dt;if(jt<=0){jt=16;const j=mkJet();W.g.add(j);j.position.set(-220,30,-30);j.rotation.y=Math.PI/2;let tt=0;W.anims.push(d2=>{tt+=d2;j.position.x+=d2*110;if(tt>4)j.visible=false})}});
  menuG=[];for(let i=0;i<3;i++){const s=mkSoldier(i===1?'ally':'player',{br:['AD','AL','AU'][i],skin:pick(SKINS)});s.root.position.set(-3+i*3,H(-3+i*3,1),1);W.g.add(s.root);animMan(s,{sp:0});s.arms[1].rotation.set(-2.6,0,-.5);menuG.push(s)}menuAvatar()}
function menuAvatar(){if(!W||!menuG)return;if(menuAv)W.g.remove(menuAv.root);menuAv=mkSoldier('player',{br:save.br,g:save.g,skin:'#e0ac7e'});menuAv.root.position.set(0,W.H(0,4)+0,4.5);W.g.add(menuAv.root);animMan(menuAv,{sp:0});menuAv.arms[1].rotation.set(-2.6,0,-.5)}
/* ---------- loop utama ---------- */
let last=performance.now(),time=0,frame=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}
function update(dt){time+=dt;frame++;
  if(G&&G.state!=='pause'){if(G.state==='play'){G.t+=dt;playerTick(dt);ENS.forEach(e=>enemyTick(e,dt));allyTick(dt);W.dest.forEach(D=>D.apc&&apcTick(D,dt));interTick(dt);objTick();pickTick(dt,time);
      let n=0;ENS.forEach(e=>{if(e.on&&e.state==='alert'&&hyp(e.x-PL.x,e.z-PL.z)<50)n++});combatLv=lerp(combatLv,Math.min(1,n/3),dt);hudTick(dt)}
    else if(G.state==='cut'){if(AL.on)allyTick(dt)}
    if(G.state!=='play'){$('act').classList.add('hidden');$('mark').style.display='none'}
    hostTick(dt);nadesTick(dt);shellsTick(dt);vehTick(dt);radioTick(dt);if(G.state!=='puzzle')laterTick(dt);if(G.state!=='puzzle')W.anims.forEach(f=>f(dt,time));clearEdges()}
  else if(!G&&W)W.anims.forEach(f=>f(dt,time));
  weatherTick(dt,time);waterU.uTime.value=time;swayU.uTime.value=time;fxTick(dt);musicTick();camUpdate(dt);
  sky.position.copy(camera.position);const fp=G?_c.set(PL.x,PL.y,PL.z):_c.set(0,0,0);sun.position.set(fp.x+ENV.dir[0]*80,fp.y+ENV.dir[1]*80,fp.z+ENV.dir[2]*80);sun.target.position.copy(fp);
  if(torch.intensity>0){torch.position.copy(camera.position);viewDir(_d);torch.target.position.copy(camera.position).addScaledVector(_d,10)}}
/* ---------- start ---------- */
applyLang();buildMenuScene();openMenu();music('menu');
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ac()},{passive:true}));
requestAnimationFrame(t0=>{last=t0;requestAnimationFrame(loop);setTimeout(()=>$('loading').classList.add('hidden'),300)});
window.__g={los,get G(){return G},PL,AL,ENS,HOST,INTER,W:()=>W,startMission,goMap,inp,keys,joy,sim:s=>{for(let i=0;i<s*30;i++)update(1/30)},callSupport,takePhoto,curObj,missionComplete,openBrief,save,setLang,TK:()=>TK,openLib,enterTank};

}
(document.fonts&&document.fonts.load?Promise.race([Promise.all([document.fonts.load('700 46px Fredoka'),document.fonts.load('700 30px Cairo')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(__start,__start);
